<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TryggtBesök – Inköpslista</title>
    <style>
        :root {
            --bakgrund: #F8F9FA; --textfärg: #212529; --primärfärg: #01285C;
            --accentfärg: #4A6A94; --ram-radie: 10px; --varning-ljud: #FFDDC1; --varning-ljus: #FFFACD;
            --danger-color: #e63946; --hover-bg: #e9ecef;
        }
        body {
            max-width: 800px; margin: 2em auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6; background-color: var(--bakgrund); color: var(--textfärg);
        }
        h1 { color: var(--primärfärg); text-align: center; margin-bottom: 1em; font-weight: 700; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5em; }
        .vy-vaxlare { display: flex; background-color: #E9ECEF; border-radius: var(--ram-radie); padding: 5px; }
        .vy-vaxlare button {
            font-size: 1em; padding: 0.6em 1.2em; border: none; background: none; cursor: pointer;
            border-radius: 7px; font-weight: 600; transition: all 0.2s ease;
        }
        .vy-vaxlare button:not(.active):hover { background-color: #d8dee4; }
        .vy-vaxlare button.active { background-color: white; color: var(--primärfärg); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .undo-redo-controls { display: flex; gap: 1em; }
        .control-button { text-align: center; border-radius: var(--ram-radie); transition: background-color 0.2s ease; padding: 0.2em; cursor: pointer; }
        .control-button:hover { background-color: var(--hover-bg); }
        .control-button button { font-size: 2.5em; border: none; background: none; pointer-events: none; }
        .control-button label { display: block; font-size: 0.8em; margin-top: -15px; color: #6c757d; pointer-events: none; }
        
        section { position: relative; margin-bottom: 2em; }
        h2[contenteditable="true"] { border-bottom: 2px solid var(--accentfärg); padding-bottom: 0.3em; outline: none; padding-right: 40px; }
        
        .kategori-rubrik {
            padding: 8px 15px; border-radius: var(--ram-radie); color: white; margin-top: 2.5em;
            margin-bottom: 1em; font-size: 1.2em; font-weight: 600;
        }
        
        ul { list-style: none; padding-left: 0; }
        li.list-item {
            position: relative; background-color: #FFFFFF; border-radius: var(--ram-radie); padding: 15px; padding-right: 50px;
            margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); transition: all 0.2s ease-in-out; border-left: 5px solid transparent;
        }
        
        .item-header { display: flex; align-items: center; }
        li.list-item.checked .item-text { text-decoration: line-through; opacity: 0.6; }

        .custom-checkbox {
            width: 2.8em; height: 2.8em; margin-right: 1em; flex-shrink: 0;
            border: 0.15em solid #BDBDBD; border-radius: 0.25em;
            display: grid; place-content: center; cursor: pointer;
            background-color: #fff;
        }
        .custom-checkbox svg {
            width: 1.8em; height: 1.8em;
            stroke: var(--primärfärg); stroke-width: 10;
            stroke-dasharray: 100; stroke-dashoffset: 100;
            transition: stroke-dashoffset 0.2s ease-in-out;
        }
        input[type="checkbox"] { display: none; }
        input[type="checkbox"]:checked + .custom-checkbox svg {
            stroke-dashoffset: 0;
        }

        .item-text-wrapper { flex: 1; }
        .item-text { font-size: 1.2em; outline: none; }

        .vara-nummer {
            width: 25px; height: 25px; border-radius: 50%; color: white; display: inline-flex;
            align-items: center; justify-content: center; font-weight: bold; font-size: 0.9em; margin-right: 10px;
        }
        .sensorik-wrapper { text-align: center; cursor: pointer; border-radius: var(--ram-radie); padding: 4px; transition: background-color 0.2s ease; margin-left: 1em; }
        .sensorik-wrapper:hover { background-color: var(--hover-bg); }
        .sensoriska-ikoner { display: flex; gap: 8px; justify-content: center; }
        .sensoriska-ikoner span { font-size: 1.2em; }
        .sensorik-wrapper label { font-size: 0.7em; color: #6c757d; display: block; margin-top: -2px;}
        .item-detaljer { display: none; padding: 10px 0 0 70px; color: #6c757d; font-size: 0.9em; }
        li.list-item.expanded .item-detaljer { display: block; }
        
        .delete-btn {
            position: absolute; top: 50%; transform: translateY(-50%); right: 15px;
            width: 30px; height: 30px; border-radius: 50%; border: none; background-color: #f1f1f1;
            color: #888; font-size: 1.5em; line-height: 1; cursor: pointer; transition: all 0.2s ease;
        }
        .delete-btn:hover { background-color: var(--danger-color); color: white; }
        h2 + .delete-btn { top: 22px; right: 5px; }

        #addCategoryBtn {
             font-size: 1em; padding: 0.8em 1.2em; margin-top: 1em; cursor: pointer;
             border: 2px solid var(--accentfärg); background-color: transparent;
             color: var(--primärfärg); border-radius: var(--ram-radie); font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>TryggtBesök – Inköpslista</h1>
    <div class="toolbar">
        <div class="vy-vaxlare">
            <button id="planeringsvyBtn" class="active" onclick="bytVy('planering')">📝 Planeringsvy</button>
            <button id="butiksvyBtn" onclick="bytVy('butik')">🛒 Butiksvy</button>
        </div>
        <div class="undo-redo-controls">
            <div class="control-button" onclick="undo()"> <button>⟲</button> <label>Ångra</label> </div>
            <div class="control-button" onclick="redo()"> <button>⟳</button> <label>Gör om</label> </div>
        </div>
    </div>
    <div id="list-container"></div>
    <button id="addCategoryBtn" onclick="skapaKategori()">➕ Lägg till kategori</button>
    <script>
        // === DATABAS FÖR EXEMPELBUTIK ===
        const kategoriData = {
            'frukt_gront': { namn: 'Frukt & Grönt', nummer: 1, färg: '#588157' }, 'brod_bageri': { namn: 'Bageri', nummer: 2, färg: '#BC6C25' },
            'skafferi': { namn: 'Skafferi', nummer: 3, färg: '#606C38' }, 'kott_fisk': { namn: 'Kött, Fisk & Chark', nummer: 4, färg: '#D00000' },
            'mejeri_kylt': { namn: 'Mejeri & Kylt', nummer: 5, färg: '#0077B6' }, 'frys': { namn: 'Frysdisken', nummer: 6, färg: '#48CAE4' },
            'dryck': { namn: 'Drycker', nummer: 7, färg: '#F77F00' }, 'snacks_godis': { namn: 'Snacks & Godis', nummer: 8, färg: '#7209B7' },
            'hem_hygien': { namn: 'Hem & Hygien', nummer: 9, färg: '#3A0CA3' }, 'ovrigt': { namn: 'Övrigt', nummer: 99, färg: '#6c757d' }
        };
        const butiksKatalog = {
            'mjölk': { kategoriKey: 'mejeri_kylt', plats: 30, ljud: 'låg', ljus: 'stark', tips: 'Kylarna kan brumma en del.' },
            'ägg': { kategoriKey: 'mejeri_kylt', plats: 31, ljud: 'låg', ljus: 'stark', tips: 'Bredvid mjölken.' }, 'yoghurt': { kategoriKey: 'mejeri_kylt', plats: 32, ljud: 'låg', ljus: 'stark', tips: 'Olika smaker kan stå utspritt.' },
            'ost': { kategoriKey: 'mejeri_kylt', plats: 33, ljud: 'låg', ljus: 'stark', tips: 'Stark doft vid delikatessdisken.' }, 'banan': { kategoriKey: 'frukt_gront', plats: 2, ljud: 'låg', ljus: 'normal', tips: 'Ofta precis vid ingången.' },
            'äpple': { kategoriKey: 'frukt_gront', plats: 3, ljud: 'låg', ljus: 'normal', tips: 'Tänk på att välja fasta äpplen.' }, 'tomat': { kategoriKey: 'frukt_gront', plats: 4, ljud: 'låg', ljus: 'normal', tips: 'Finns både i lösvikt och förpackat.' },
            'bröd': { kategoriKey: 'brod_bageri', plats: 5, ljud: 'låg', ljus: 'normal', tips: 'Nygräddat bröd kan dofta starkt.' }, 'pasta': { kategoriKey: 'skafferi', plats: 15, ljud: 'låg', ljus: 'normal', tips: 'Finns på gång 4.' },
            'ris': { kategoriKey: 'skafferi', plats: 16, ljud: 'låg', ljus: 'normal', tips: 'Stora säckar längst ner på hyllan.' }, 'köttfärs': { kategoriKey: 'kott_fisk', plats: 25, ljud: 'låg', ljus: 'stark', tips: 'Kyldisken för kött.' },
            'kyckling': { kategoriKey: 'kott_fisk', plats: 26, ljud: 'låg', ljus: 'stark', tips: 'Finns både färsk och fryst.' }, 'korv': { kategoriKey: 'kott_fisk', plats: 27, ljud: 'låg', ljus: 'stark', tips: 'Många olika sorter.' },
            'frysta ärtor': { kategoriKey: 'frys', plats: 40, ljud: 'hög', ljus: 'stark', tips: 'Frysdiskarna kan låta mycket.' }, 'glass': { kategoriKey: 'frys', plats: 41, ljud: 'hög', ljus: 'stark', tips: 'Ofta i slutet av fryssektionen.' },
            'läsk': { kategoriKey: 'dryck', plats: 50, ljud: 'normal', ljus: 'normal', tips: 'Pantstationen är ofta bullrig.' }, 'chips': { kategoriKey: 'snacks_godis', plats: 60, ljud: 'normal', ljus: 'normal', tips: 'Ofta placerat nära dryckesavdelningen.' },
            'tvättmedel': { kategoriKey: 'hem_hygien', plats: 70, ljud: 'låg', ljus: 'stark', tips: 'Kan ha starka dofter.' }, 'schampo': { kategoriKey: 'hem_hygien', plats: 71, ljud: 'låg', ljus: 'stark', tips: 'Många olika dofter.' },
        };
        const STORAGE_KEY = "tryggtbesok_inkopslista_v12";
        let aktivVy = 'planering';
        let senastePlaneringsvyHTML = '';
        let undoStack = [], redoStack = [];

        function sparaTillstånd(force = false) { const listContainer = document.getElementById("list-container"); const nuvarandeInnehåll = listContainer.innerHTML; if (aktivVy === 'planering') { senastePlaneringsvyHTML = nuvarandeInnehåll; } if (force || (undoStack.length === 0 || undoStack[undoStack.length - 1] !== nuvarandeInnehåll)) { undoStack.push(nuvarandeInnehåll); if (undoStack.length > 50) undoStack.shift(); redoStack = []; localStorage.setItem(STORAGE_KEY, senastePlaneringsvyHTML); } }
        
        // FIX: Justerad Ångra/Gör om-logik för att vara vy-medveten
        function undo() {
            if (undoStack.length > 1) {
                redoStack.push(undoStack.pop());
                const föregående = undoStack[undoStack.length - 1];
                if(aktivVy === 'planering') {
                    senastePlaneringsvyHTML = föregående;
                    document.getElementById("list-container").innerHTML = föregående;
                    bifogaLyssnare();
                } else {
                    senastePlaneringsvyHTML = föregående; // Återställ källan
                    render(); // Rendera om Butiksvyn baserat på den återställda källan
                }
            }
        }
        function redo() {
            if (redoStack.length > 0) {
                const nästa = redoStack.pop();
                undoStack.push(nästa);
                if(aktivVy === 'planering') {
                    senastePlaneringsvyHTML = nästa;
                    document.getElementById("list-container").innerHTML = nästa;
                    bifogaLyssnare();
                } else {
                    senastePlaneringsvyHTML = nästa;
                    render();
                }
            }
        }

        function bytVy(vy) { if (aktivVy === 'planering') sparaTillstånd(true); aktivVy = vy; document.getElementById('planeringsvyBtn').classList.toggle('active', vy === 'planering'); document.getElementById('butiksvyBtn').classList.toggle('active', vy === 'butik'); document.getElementById('addCategoryBtn').style.display = vy === 'planering' ? 'block' : 'none'; render(); }

        function render() {
            const listContainer = document.getElementById('list-container');
            if (aktivVy === 'planering') { listContainer.innerHTML = senastePlaneringsvyHTML; } 
            else { // Butiksvy
                const tempDiv = document.createElement('div'); tempDiv.innerHTML = senastePlaneringsvyHTML;
                let allaVaror = [];
                tempDiv.querySelectorAll('.list-item').forEach(itemElem => { const text = itemElem.querySelector('.item-text').textContent; const isChecked = itemElem.querySelector('input[type="checkbox"]').checked; if(text && text.trim() && text.trim() !== "Skriv en vara...") { const varaData = hittaVaraIDatabas(text); allaVaror.push({ ...varaData, text: text, checked: isChecked }); } });
                allaVaror.sort((a, b) => { const katANum = a.kategori ? a.kategori.nummer : 999; const katBNum = b.kategori ? b.kategori.nummer : 999; if (katANum !== katBNum) return katANum - katBNum; return a.plats - b.plats; });
                listContainer.innerHTML = ''; const ul = document.createElement('ul'); let nuvarandeKategoriNummer = -1;
                allaVaror.forEach(vara => {
                    if (vara.kategori && vara.kategori.nummer !== nuvarandeKategoriNummer) {
                        nuvarandeKategoriNummer = vara.kategori.nummer;
                        const kategoriRubrik = document.createElement('h2'); kategoriRubrik.className = 'kategori-rubrik';
                        kategoriRubrik.textContent = `${vara.kategori.nummer}. ${vara.kategori.namn}`; kategoriRubrik.style.backgroundColor = vara.kategori.färg;
                        ul.appendChild(kategoriRubrik);
                    }
                    ul.appendChild(skapaVaraElement(vara.text, vara.checked));
                });
                listContainer.appendChild(ul);
            }
            bifogaLyssnare();
        }
        
        function skapaKategori(titel = "Ny Kategori") { const section = document.createElement("section"); const deleteBtn = `<button class="delete-btn delete-category-btn">×</button>`; section.innerHTML = `<h2 contenteditable="true">${titel}</h2>${deleteBtn}<ul></ul>`; const ul = section.querySelector('ul'); const förstaVaran = skapaVaraElement(); ul.appendChild(förstaVaran); document.getElementById("list-container").appendChild(section); bifogaLyssnare(); sparaTillstånd(true); förstaVaran.querySelector('.item-text').focus(); }

        function skapaVaraElement(text = "Skriv en vara...", isChecked = false) {
            const li = document.createElement("li"); li.className = "list-item"; if(isChecked) li.classList.add('checked');
            const varaData = hittaVaraIDatabas(text); const kategoriFärg = varaData.kategori ? varaData.kategori.färg : 'transparent';
            li.style.borderLeftColor = kategoriFärg; const harSensorik = varaData.ljud === 'hög' || varaData.ljus === 'stark';
            const sensorikHTML = `<div class="sensorik-wrapper"><div class="sensoriska-ikoner">${varaData.ljud === 'hög' ? '<span>🔊</span>' : ''}${varaData.ljus === 'stark' ? '<span>✨</span>' : ''}</div>${harSensorik ? '<label>Tips</label>' : ''}</div>`;
            const checkboxId = `checkbox-${Date.now()}-${Math.random()}`;
            li.innerHTML = `<div class="item-header"><input type="checkbox" id="${checkboxId}" ${isChecked ? 'checked' : ''}><label for="${checkboxId}" class="custom-checkbox"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polyline points="20 60 40 80 80 30" fill="none" /></svg></label>${varaData.kategori && aktivVy === 'butik' ? `<div class="vara-nummer" style="background-color: ${kategoriFärg};">${varaData.kategori.nummer}</div>` : ''}<div class="item-text-wrapper"><div contenteditable="true" class="item-text">${text}</div></div>${aktivVy === 'butik' ? sensorikHTML : ''}</div>${aktivVy === 'butik' && harSensorik ? `<div class="item-detaljer"><p><strong>Tips:</strong> ${varaData.tips}</p></div>` : ''}<button class="delete-btn delete-item-btn">×</button>`;
            return li;
        }
        
        function hittaVaraIDatabas(text) { const sökTerm = text.trim().toLowerCase(); for (const key in butiksKatalog) { if (sökTerm.includes(key)) { const vara = butiksKatalog[key]; return { ...vara, kategori: kategoriData[vara.kategoriKey] }; } } return { kategoriKey: 'ovrigt', plats: 999, ljud: 'okänd', ljus: 'okänd', tips: 'Egen vara, ingen specifik info finns.', kategori: kategoriData['ovrigt'] }; }

        function bifogaLyssnare() {
            const listContainer = document.getElementById('list-container');
            listContainer.onclick = function(e) {
                if (e.target.matches('.delete-item-btn')) { e.target.closest('li.list-item').remove(); sparaTillstånd(true); }
                else if (e.target.matches('.delete-category-btn')) { e.target.closest('section').remove(); sparaTillstånd(true); }
                else if (e.target.closest('.custom-checkbox')) { 
                    const listItem = e.target.closest('li.list-item');
                    const checkboxInput = listItem.querySelector('input[type="checkbox"]');
                    setTimeout(() => { listItem.classList.toggle('checked', checkboxInput.checked); sparaTillstånd(); }, 0);
                }
                else if (e.target.closest('.sensorik-wrapper')) { e.target.closest('.list-item').classList.toggle("expanded"); }
                else if (e.target.matches('.item-header, .item-header *') && !e.target.matches('[contenteditable="true"], .custom-checkbox, .custom-checkbox *')) { e.target.closest('.list-item').classList.toggle("expanded"); }
            };
            listContainer.oninput = function(e) { if (e.target.matches('[contenteditable="true"]')) { sparaTillstånd(); } };
            listContainer.onkeydown = function(e) {
                if (e.target.matches('.item-text') && e.key === "Enter") {
                    e.preventDefault(); const nuvarandeVara = e.target.closest('li'); const nyVara = skapaVaraElement();
                    nuvarandeVara.insertAdjacentElement("afterend", nyVara); nyVara.querySelector('.item-text').focus(); sparaTillstånd(true);
                }
            };
        }

        function init() {
            const listContainer = document.getElementById("list-container");
            let sparadHTML = localStorage.getItem(STORAGE_KEY);
            if (!sparadHTML || !sparadHTML.trim()) {
                const tempDiv = document.createElement('div');
                const section = document.createElement("section");
                const deleteBtn = `<button class="delete-btn delete-category-btn">×</button>`;
                section.innerHTML = `<h2 contenteditable="true">Ny Kategori</h2>${deleteBtn}<ul></ul>`;
                const ul = section.querySelector('ul');
                ul.appendChild(skapaVaraElement());
                tempDiv.appendChild(section);
                sparadHTML = tempDiv.innerHTML;
            }
            senastePlaneringsvyHTML = sparadHTML;
            listContainer.innerHTML = sparadHTML;
            bifogaLyssnare();
            sparaTillstånd(true);
        }

        init();
    </script>
</body>
</html>
